<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1c2b28">
<title>Базис — тренажер слів і часів</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @font-face{
    font-family:'Fraunces';
    src:url('fonts/fraunces-400.woff2') format('woff2');
    font-weight:400; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Fraunces';
    src:url('fonts/fraunces-600.woff2') format('woff2');
    font-weight:600; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Fraunces';
    src:url('fonts/fraunces-700.woff2') format('woff2');
    font-weight:700; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'IBM Plex Mono';
    src:url('fonts/plexmono-400.woff2') format('woff2');
    font-weight:400; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'IBM Plex Mono';
    src:url('fonts/plexmono-500.woff2') format('woff2');
    font-weight:500; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Inter';
    src:url('fonts/inter-400.woff2') format('woff2');
    font-weight:400; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Inter';
    src:url('fonts/inter-500.woff2') format('woff2');
    font-weight:500; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Inter';
    src:url('fonts/inter-600.woff2') format('woff2');
    font-weight:600; font-style:normal; font-display:swap;
  }

  :root{
    --ink:#ece6d8;
    --paper:#0c0e16;
    --paper-deep:#05060a;
    --moss:#5fb8ad;
    --gold:#c9a35d;
    --rust:#8f3a3a;
    --dim:#7d8699;
    --line:rgba(236,230,216,0.11);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 18px 60px;
    position:relative;
    overflow-x:hidden;
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%, transparent 0%, rgba(0,0,0,0.55) 100%);
  }

  #bg-fx{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:0.22;
    will-change:transform;
  }
  .blob-1{
    width:560px; height:560px;
    top:-200px; left:-160px;
    background:radial-gradient(circle, rgba(95,184,173,0.45), transparent 70%);
    animation:drift1 42s ease-in-out infinite alternate;
  }
  .blob-2{
    width:500px; height:500px;
    bottom:-180px; right:-140px;
    background:radial-gradient(circle, rgba(201,163,93,0.28), transparent 70%);
    animation:drift2 50s ease-in-out infinite alternate;
  }
  .blob-3{
    width:420px; height:420px;
    top:40%; left:60%;
    background:radial-gradient(circle, rgba(80,70,140,0.32), transparent 70%);
    animation:drift3 36s ease-in-out infinite alternate;
  }

  @keyframes drift1{
    0%{ transform:translate(0,0) scale(1); }
    100%{ transform:translate(60px,80px) scale(1.15); }
  }
  @keyframes drift2{
    0%{ transform:translate(0,0) scale(1); }
    100%{ transform:translate(-70px,-50px) scale(1.1); }
  }
  @keyframes drift3{
    0%{ transform:translate(0,0) scale(1); }
    100%{ transform:translate(-40px,60px) scale(0.9); }
  }

  .firefly{
    position:absolute;
    bottom:-10px;
    width:2px;
    height:2px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 5px 1px rgba(201,163,93,0.55);
    opacity:0;
    animation-name:rise, flicker;
    animation-timing-function:ease-in-out, ease-in-out;
    animation-iteration-count:infinite, infinite;
  }
  @keyframes rise{
    0%{ transform:translate(0,0); opacity:0; }
    10%{ opacity:0.6; }
    50%{ transform:translate(var(--drift,20px), -55vh); opacity:0.45; }
    90%{ opacity:0.2; }
    100%{ transform:translate(calc(var(--drift,20px) * 1.6), -100vh); opacity:0; }
  }
  @keyframes flicker{
    0%, 100%{ filter:brightness(1); }
    50%{ filter:brightness(1.8); }
  }

  @media (prefers-reduced-motion: reduce){
    .blob, .firefly{ animation:none !important; }
    .firefly{ display:none; }
  }

  .card{ width:100%; max-width:520px; position:relative; z-index:1; }

  .eyebrow{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:18px;
  }
  .eyebrow .dot{color:var(--gold);}

  .stats{
    display:flex;
    gap:14px;
    margin-bottom:18px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--dim);
  }
  .stats b{ color:var(--ink); }

  .stage{
    background:linear-gradient(180deg, rgba(236,230,216,0.04), rgba(236,230,216,0.015));
    border:1px solid var(--line);
    border-radius:3px;
    padding:38px 30px 28px;
    position:relative;
    box-shadow:0 30px 80px -30px rgba(0,0,0,0.7), inset 0 1px 0 rgba(236,230,216,0.04);
  }
  .stage::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:0.5;
  }
  .stage::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    border-radius:3px;
    box-shadow:inset 0 0 90px rgba(0,0,0,0.35);
  }

  .head-row{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .word{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(30px, 7vw, 42px);
    line-height:1.05;
    margin:0;
    text-shadow:0 0 28px rgba(95,184,173,0.28);
  }
  .pos{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--paper-deep);
    background:radial-gradient(circle at 35% 30%, #e0bd7d, var(--gold) 70%);
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:4px;
    box-shadow:0 0 0 1px rgba(201,163,93,0.35), 0 0 16px rgba(201,163,93,0.35), inset 0 1px 2px rgba(255,255,255,0.35);
    flex-shrink:0;
  }
  .phonetic{
    font-family:'IBM Plex Mono',monospace;
    color:var(--dim);
    font-size:14px;
    margin-top:6px;
  }
  .translation{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:21px;
    color:var(--moss);
    margin-top:10px;
    text-shadow:0 0 18px rgba(95,184,173,0.25);
  }

  .forms{
    margin-top:16px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--dim);
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .forms span{
    background:rgba(236,230,216,0.035);
    border:1px solid var(--line);
    padding:6px 9px;
    border-radius:2px;
    line-height:1.6;
  }
  .forms b{ color:var(--ink); }
  .forms i{ color:var(--dim); font-style:normal; font-size:11.5px; }

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:24px 0;
    color:var(--gold);
    opacity:0.55;
    font-size:11px;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }


  .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:10px;
  }

  .ex-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:20px; }
  .ex-item{ border-left:2px solid var(--line); padding-left:14px; }
  .ex-tense{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:3px;
  }
  .ex-sentence{ font-size:15.5px; line-height:1.5; font-style:italic; color:var(--ink); }

  .note{
    font-size:14px;
    line-height:1.55;
    color:var(--dim);
    background:rgba(201,163,93,0.06);
    border:1px solid rgba(201,163,93,0.2);
    padding:12px 14px;
    border-radius:2px;
  }
  .note b{ color:var(--gold); font-weight:600; }

  .actions{
    display:flex;
    gap:10px;
    margin-top:24px;
  }
  button{
    flex:1;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:14px 10px;
    border-radius:2px;
    cursor:pointer;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    transition:border-color 0.15s, color 0.15s, background 0.15s;
  }
  button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .btn-forgot:hover{ border-color:var(--rust); color:var(--rust); }
  .btn-know{
    background:rgba(95,184,173,0.08);
    color:var(--moss);
    border-color:rgba(95,184,173,0.4);
    box-shadow:0 0 14px rgba(95,184,173,0.15);
  }
  .btn-know:hover{
    background:rgba(95,184,173,0.14);
    border-color:var(--moss);
    box-shadow:0 0 20px rgba(95,184,173,0.28);
  }

  .empty{
    text-align:center;
    padding:40px 20px;
  }
  .empty .big{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    margin-bottom:10px;
  }
  .empty p{ color:var(--dim); font-size:14px; line-height:1.5; }

  .reset-row{
    margin-top:20px;
    text-align:center;
  }
  .reset-link{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--dim);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    padding:4px;
    flex:none;
  }

  .footnote{
    margin-top:14px;
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    line-height:1.6;
    color:rgba(157,179,169,0.55);
  }

  @media (max-width:420px){
    .stage{ padding:28px 20px 22px; }
  }
</style>
</head>
<body>

<div id="bg-fx">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div id="fireflies"></div>
</div>

<div class="card">
  <div class="eyebrow">
    <span>Базис</span>
    <span><span class="dot">●</span> тренажер слів і часів</span>
  </div>

  <div class="stats">
    <span>На повторення: <b id="dueCount">0</b></span>
    <span>Нових: <b id="newCount">0</b></span>
    <span>Вивчено: <b id="masteredCount">0</b></span>
  </div>

  <div class="stage" id="stage"></div>

  <div class="reset-row">
    <button class="reset-link" id="resetBtn">Скинути весь прогрес</button>
  </div>

  <div class="footnote">Прогрес зберігається лише на цьому пристрої й у цьому браузері.<br>Можна встановити як застосунок: меню браузера → «Додати на головний екран».</div>
</div>

<script>
/* ---------- Фонові світлячки ---------- */
(function initFireflies(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion) return;
  const container = document.getElementById('fireflies');
  const COUNT = 18;
  for(let i = 0; i < COUNT; i++){
    const el = document.createElement('div');
    el.className = 'firefly';
    const left = Math.random() * 100;
    const duration = 14 + Math.random() * 14;
    const delay = Math.random() * 20;
    const drift = (Math.random() * 80 - 40).toFixed(0) + 'px';
    const size = (2 + Math.random() * 2.5).toFixed(1) + 'px';
    el.style.left = left + 'vw';
    el.style.width = size;
    el.style.height = size;
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = '-' + delay + 's';
    el.style.setProperty('--drift', drift);
    container.appendChild(el);
  }
})();

/* ---------- Дані ---------- */
// Кожне слово: en, ph (транскрипція IPA), uk, pos, forms (тільки для дієслів), examples (Present/Past/Perfect), note.
// Список легко розширюється — просто додай ще один об'єкт у ITEMS у тому ж форматі.
const ITEMS = [
  {id:"throw_away", en:"throw away", ph:"/θroʊ əˈweɪ/", uk:"викидати (сміття)", pos:"verb", forms:{base:"throw away",past:"threw away",part:"thrown away",phBase:"/θroʊ əˈweɪ/",phPast:"/θruː əˈweɪ/",phPart:"/θroʊn əˈweɪ/"},
    examples:[["Present Simple","I throw away the trash every evening."],["Past Simple","I threw away the trash yesterday."],["Present Perfect","I've already thrown away the trash."]],
    note:"«Throw away» = <b>викидати</b> непотрібне. Просто «throw» — кидати (м'яч), не сміття. Із займенником частка йде <b>після</b> нього: «throw it away» / «throw it out», а не «throw away it»."},
  {id:"throw_out", en:"throw out", ph:"/θroʊ aʊt/", uk:"викидати (синонім throw away)", pos:"verb", forms:{base:"throw out",past:"threw out",part:"thrown out",phBase:"/θroʊ aʊt/",phPast:"/θruː aʊt/",phPart:"/θroʊn aʊt/"},
    examples:[["Present Simple","I throw out old food every week."],["Past Simple","I threw out the broken chair yesterday."],["Present Perfect","I've thrown out three bags of trash already."]],
    note:"Практично те саме, що «throw away» — вибір частки (out/away) не міняє суті. Головне правило те саме: з займенником — «throw it out», не «throw out it»."},
  {id:"forget", en:"forget", ph:"/fərˈɡɛt/", uk:"забувати", pos:"verb", forms:{base:"forget",past:"forgot",part:"forgotten",phBase:"/fərˈɡɛt/",phPast:"/fərˈɡɑːt/",phPart:"/fərˈɡɑːtən/"},
    examples:[["Present Simple","I always forget his name."],["Past Simple","I forgot my keys this morning."],["Present Perfect","I've forgotten what she said."]],
    note:"«Forget to do» — забути зробити щось (наперед). «Forget doing» — забути, що вже робив."},
  {id:"remember", en:"remember", ph:"/rɪˈmɛmbər/", uk:"пам'ятати", pos:"verb", forms:{base:"remember",past:"remembered",part:"remembered",phBase:"/rɪˈmɛmbər/",phPast:"/rɪˈmɛmbərd/",phPart:"/rɪˈmɛmbərd/"},
    examples:[["Present Simple","I remember that day clearly."],["Past Simple","I remembered his birthday just in time."],["Present Perfect","I've never forgotten his birthday."]],
    note:"«Remember to do» — не забути зробити. «Remember doing» — пам'ятати, що робив."},
  {id:"buy", en:"buy", ph:"/baɪ/", uk:"купувати", pos:"verb", forms:{base:"buy",past:"bought",part:"bought",phBase:"/baɪ/",phPast:"/bɔːt/",phPart:"/bɔːt/"},
    examples:[["Present Simple","I buy groceries on Fridays."],["Past Simple","I bought a new laptop last week."],["Present Perfect","I've bought too many books this year."]],
    note:""},
  {id:"bring", en:"bring", ph:"/brɪŋ/", uk:"приносити", pos:"verb", forms:{base:"bring",past:"brought",part:"brought",phBase:"/brɪŋ/",phPast:"/brɔːt/",phPart:"/brɔːt/"},
    examples:[["Present Simple","Can you bring your laptop tomorrow?"],["Past Simple","She brought coffee for everyone."],["Present Perfect","He's brought his dog to work again."]],
    note:"«Bring» — сюди (до мовця). «Take» — туди (від мовця)."},
  {id:"take", en:"take", ph:"/teɪk/", uk:"брати, забирати", pos:"verb", forms:{base:"take",past:"took",part:"taken",phBase:"/teɪk/",phPast:"/tʊk/",phPart:"/ˈteɪkən/"},
    examples:[["Present Simple","I take the bus every morning."],["Past Simple","I took my dog for a walk."],["Present Perfect","I've taken this route before."]],
    note:"Див. різницю bring/take вище."},
  {id:"go", en:"go", ph:"/ɡoʊ/", uk:"йти, їхати", pos:"verb", forms:{base:"go",past:"went",part:"gone",phBase:"/ɡoʊ/",phPast:"/wɛnt/",phPart:"/ɡɔːn/"},
    examples:[["Present Simple","I go to the gym twice a week."],["Past Simple","I went to the gym yesterday."],["Present Perfect","He's gone to the store."]],
    note:"«I've been to Kyiv» — їздив і повернувся. «He's gone to Kyiv» — поїхав і ще там."},
  {id:"do", en:"do", ph:"/duː/", uk:"робити (справи, дії)", pos:"verb", forms:{base:"do",past:"did",part:"done",phBase:"/duː/",phPast:"/dɪd/",phPart:"/dʌn/"},
    examples:[["Present Simple","I do my chores on Sundays."],["Past Simple","I did my homework already."],["Present Perfect","I've done everything on the list."]],
    note:"«Do» — виконувати дію/обов'язок. «Make» — створювати щось нове."},
  {id:"make", en:"make", ph:"/meɪk/", uk:"робити, створювати", pos:"verb", forms:{base:"make",past:"made",part:"made",phBase:"/meɪk/",phPast:"/meɪd/",phPart:"/meɪd/"},
    examples:[["Present Simple","I make dinner every night."],["Past Simple","I made a mistake."],["Present Perfect","I've made this recipe many times."]],
    note:"Див. різницю do/make вище."},
  {id:"get", en:"get", ph:"/ɡɛt/", uk:"отримувати, ставати", pos:"verb", forms:{base:"get",past:"got",part:"gotten / got",phBase:"/ɡɛt/",phPast:"/ɡɑːt/",phPart:"/ˈɡɑːtən/"},
    examples:[["Present Simple","I get tired after work."],["Past Simple","I got a new job."],["Present Perfect","I've gotten used to the cold winters."]],
    note:"«Get» має купу значень — отримувати, ставати, приходити. Орієнтуйся по контексту речення."},
  {id:"give", en:"give", ph:"/ɡɪv/", uk:"давати", pos:"verb", forms:{base:"give",past:"gave",part:"given",phBase:"/ɡɪv/",phPast:"/ɡeɪv/",phPart:"/ˈɡɪvən/"},
    examples:[["Present Simple","I give him a ride every day."],["Past Simple","I gave her my old phone."],["Present Perfect","I've given up sugar."]],
    note:"«Give up» — кинути / відмовитись від чогось. Із займенником: «give it up», не «give up it»."},
  {id:"put", en:"put", ph:"/pʊt/", uk:"класти, ставити", pos:"verb", forms:{base:"put",past:"put",part:"put",phBase:"/pʊt/",phPast:"/pʊt/",phPart:"/pʊt/"},
    examples:[["Present Simple","I put my keys on the table every day."],["Past Simple","I put my keys on the table yesterday."],["Present Perfect","I've put it in the wrong place again."]],
    note:"Форма однакова у всіх часах — слухай контекст (every day / yesterday / already)."},
  {id:"run", en:"run", ph:"/rʌn/", uk:"бігати, керувати (бізнесом)", pos:"verb", forms:{base:"run",past:"ran",part:"run",phBase:"/rʌn/",phPast:"/ræn/",phPart:"/rʌn/"},
    examples:[["Present Simple","I run three times a week."],["Past Simple","I ran five kilometers yesterday."],["Present Perfect","I've run this business for two years."]],
    note:"«Run a business» — керувати бізнесом, не тільки бігати."},
  {id:"drive", en:"drive", ph:"/draɪv/", uk:"керувати авто", pos:"verb", forms:{base:"drive",past:"drove",part:"driven",phBase:"/draɪv/",phPast:"/droʊv/",phPart:"/ˈdrɪvən/"},
    examples:[["Present Simple","I drive to work every day."],["Past Simple","I drove to Charlottetown yesterday."],["Present Perfect","I've driven this Jeep for years."]],
    note:""},
  {id:"eat", en:"eat", ph:"/iːt/", uk:"їсти", pos:"verb", forms:{base:"eat",past:"ate",part:"eaten",phBase:"/iːt/",phPast:"/eɪt/",phPart:"/ˈiːtən/"},
    examples:[["Present Simple","I eat breakfast at 7."],["Past Simple","I ate breakfast an hour ago."],["Present Perfect","I've already eaten."]],
    note:""},
  {id:"drink", en:"drink", ph:"/drɪŋk/", uk:"пити", pos:"verb", forms:{base:"drink",past:"drank",part:"drunk",phBase:"/drɪŋk/",phPast:"/dræŋk/",phPart:"/drʌŋk/"},

/* ---------- Інтервальні повтори ---------- */
const STORAGE_KEY = "basis_progress_v1";
const INTERVALS_DAYS = [1, 3, 7, 14, 30]; // box 1..5, box 5+ повторюється кожні 30 днів

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}

let progress = loadProgress();
let currentId = null;

function now(){ return Date.now(); }
function daysToMs(d){ return d * 24 * 60 * 60 * 1000; }

function buildQueue(){
  const t = now();
  const due = [];
  const fresh = [];
  for(const item of ITEMS){
    const p = progress[item.id];
    if(!p){ fresh.push(item.id); }
    else if(p.next <= t){ due.push({id:item.id, next:p.next}); }
  }
  due.sort((a,b) => a.next - b.next);
  return due.map(d => d.id).concat(fresh);
}

function updateStats(){
  const t = now();
  let due = 0, fresh = 0, mastered = 0;
  for(const item of ITEMS){
    const p = progress[item.id];
    if(!p) fresh++;
    else if(p.next <= t) due++;
    if(p && p.box >= 5) mastered++;
  }
  document.getElementById('dueCount').textContent = due;
  document.getElementById('newCount').textContent = fresh;
  document.getElementById('masteredCount').textContent = mastered;
}

function findItem(id){ return ITEMS.find(i => i.id === id); }

function renderCard(id){
  const item = findItem(id);
  const stage = document.getElementById('stage');

  let formsHtml = '';
  if(item.forms){
    formsHtml = `<div class="forms">
      <span>Present: <b>${item.forms.base}</b><br><i>${item.forms.phBase}</i></span>
      <span>Past: <b>${item.forms.past}</b><br><i>${item.forms.phPast}</i></span>
      <span>Participle: <b>${item.forms.part}</b><br><i>${item.forms.phPart}</i></span>
    </div>`;
  }

  const exHtml = item.examples.map(([tense, sentence]) =>
    `<div class="ex-item">
      <div class="ex-tense">${tense}</div>
      <div class="ex-sentence">"${sentence}"</div>
    </div>`
  ).join('');

  const noteHtml = item.note ? `<div class="note">${item.note}</div>` : '';

  stage.innerHTML = `
    <div class="head-row">
      <p class="word">${item.en}</p>
      <span class="pos">${item.pos}</span>
    </div>
    <div class="phonetic">${item.ph}</div>
    <div class="translation">${item.uk}</div>
    ${formsHtml}
    <div class="divider">✦</div>
    <div class="label">Приклади в різних часах</div>
    <div class="ex-list">${exHtml}</div>
    ${noteHtml}
    <div class="actions">
      <button class="btn-forgot" id="forgotBtn">Забув</button>
      <button class="btn-know" id="knowBtn">Знаю</button>
    </div>
  `;

  document.getElementById('forgotBtn').addEventListener('click', () => answer(id, false));
  document.getElementById('knowBtn').addEventListener('click', () => answer(id, true));
}

function renderEmpty(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="empty">
      <div class="big">На сьогодні все 🌿</div>
      <p>Ти пройшов усі слова, які були заплановані на повторення. Повертайся завтра — розклад повторень з'явиться автоматично.</p>
    </div>
  `;
}

function answer(id, knew){
  const p = progress[id] || {box: 0, next: 0};
  if(knew){
    p.box = Math.min((p.box || 0) + 1, 5);
  } else {
    p.box = 1;
  }
  const intervalIdx = Math.min(p.box - 1, INTERVALS_DAYS.length - 1);
  p.next = now() + daysToMs(INTERVALS_DAYS[intervalIdx]);
  progress[id] = p;
  saveProgress(progress);
  updateStats();
  nextCard();
}

function nextCard(){
  const queue = buildQueue();
  if(queue.length === 0){
    currentId = null;
    renderEmpty();
    return;
  }
  currentId = queue[0];
  renderCard(currentId);
}

document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('Точно скинути весь прогрес? Це не можна відмінити.')){
    progress = {};
    saveProgress(progress);
    updateStats();
    nextCard();
  }
});

updateStats();
nextCard();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
