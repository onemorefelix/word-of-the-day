<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c0e16">
<title>Базис</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="bg-fx">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div id="fireflies"></div>
</div>

<div class="card">
  <div class="eyebrow">
    <span>Базис</span>
    <span><a href="grammar.html">Граматика →</a></span>
  </div>

  <div class="topic-list" id="topicList"></div>

  <div class="footnote">Прогрес зберігається лише на цьому пристрої й у цьому браузері.<br>Можна встановити як застосунок: меню браузера → «Додати на головний екран».</div>
</div>

<script>
/* ---------- Реєстр тем ---------- */
// Щоб додати нову тему пізніше: додай сюди запис і поклади відповідний data/*.json поруч.
const TOPICS = [
  {
    id:"core",
    name:"Основні слова",
    desc:"Найчастотніші дієслова й побутова лексика — фундамент активного мовлення.",
    file:"data/core.json",
    tag:null
  },
  {
    id:"environment",
    name:"Environment",
    desc:"Лексика IELTS про довкілля: сталий розвиток, забруднення, зміна клімату.",
    file:"data/environment.json",
    tag:"IELTS · пілот"
  }
];

const STORAGE_PREFIX = "basis_progress_";

function loadProgress(topicId){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX + topicId);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}

async function computeTopicStats(topic){
  try{
    const res = await fetch(topic.file);
    const items = await res.json();
    const progress = loadProgress(topic.id);
    const t = Date.now();
    let due = 0, fresh = 0, mastered = 0;
    for(const item of items){
      const p = progress[item.id];
      if(!p) fresh++;
      else if(p.next <= t) due++;
      if(p && p.box >= 5) mastered++;
    }
    return { total: items.length, due, fresh, mastered, ok:true };
  }catch(e){
    return { total:0, due:0, fresh:0, mastered:0, ok:false };
  }
}

async function render(){
  const list = document.getElementById('topicList');
  list.innerHTML = TOPICS.map(t => `<div class="topic-card" data-id="${t.id}" style="opacity:0.5">
    <div class="t-head">
      <span class="t-name">${t.name}</span>
      <span class="t-count">…</span>
    </div>
    <div class="t-desc">${t.desc}</div>
    ${t.tag ? `<span class="topic-tag">${t.tag}</span>` : ''}
    <div class="t-progress"><div class="t-progress-fill" style="width:0%"></div></div>
  </div>`).join('');

  for(const topic of TOPICS){
    const stats = await computeTopicStats(topic);
    const el = list.querySelector(`[data-id="${topic.id}"]`);
    if(!el) continue;
    el.style.opacity = 1;

    if(!stats.ok){
      el.classList.add('locked');
      el.querySelector('.t-count').textContent = 'немає з\'єднання';
      continue;
    }

    const pct = stats.total ? Math.round((stats.mastered / stats.total) * 100) : 0;
    el.querySelector('.t-count').textContent = `${stats.due} на повторення · ${stats.total} слів`;
    el.querySelector('.t-progress-fill').style.width = pct + '%';

    el.addEventListener('click', () => {
      window.location.href = `trainer.html?topic=${topic.id}`;
    });
  }
}

render();

/* ---------- Фонові світлячки ---------- */
(function initFireflies(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion) return;
  const container = document.getElementById('fireflies');
  const COUNT = 18;
  for(let i = 0; i < COUNT; i++){
    const el = document.createElement('div');
    el.className = 'firefly';
    const left = Math.random() * 100;
    const duration = 14 + Math.random() * 14;
    const delay = Math.random() * 20;
    const drift = (Math.random() * 80 - 40).toFixed(0) + 'px';
    const size = (2 + Math.random() * 2.5).toFixed(1) + 'px';
    el.style.left = left + 'vw';
    el.style.width = size;
    el.style.height = size;
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = '-' + delay + 's';
    el.style.setProperty('--drift', drift);
    container.appendChild(el);
  }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
