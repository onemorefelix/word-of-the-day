<script src="app.js"></script>
<script>
/* ---------- Реєстр тем ---------- */
const TOPICS = [
  {
    id:"core",
    name:"Основні слова",
    desc:"Найчастотніші дієслова й побутова лексика — фундамент активного мовлення.",
    file:"data/core.json",
    tag:null
  },
  {
    id:"environment",
    name:"Environment",
    desc:"Лексика IELTS про довкілля: сталий розвиток, забруднення, зміна клімату.",
    file:"data/environment.json",
    tag:"IELTS · пілот"
  },
  {
    id:"education",
    name:"Education",
    desc:"Освіта: навчання, кваліфікації, шкільна й вища освіта.",
    file:"data/education.json",
    tag:"IELTS"
  },
  {
    id:"technology",
    name:"Technology & Media",
    desc:"Технології та медіа: цифрові пристрої, інтернет, соцмережі, ЗМІ.",
    file:"data/technology.json",
    tag:"IELTS"
  },
  {
    id:"health",
    name:"Health & Fitness",
    desc:"Здоров'я: медицина, хвороби, здоровий спосіб життя.",
    file:"data/health.json",
    tag:"IELTS"
  },
  {
    id:"work",
    name:"Work & Career",
    desc:"Робота й кар'єра: працевлаштування, професії, робоче середовище.",
    file:"data/work.json",
    tag:"IELTS"
  },
  {
    id:"crime",
    name:"Crime & Law",
    desc:"Злочинність і право: закони, правопорушення, судова система.",
    tag:"IELTS"
  },
  {
    id:"government",
    name:"Government & Society",
    desc:"Уряд і суспільство: влада, політика, громадянські права, соціальні інститути.",
    tag:"IELTS"
  },
  {
    id:"globalization",
    name:"Globalization & Culture",
    desc:"Глобалізація та культура: міжнародні зв'язки, культурний обмін, традиції.",
    tag:"IELTS"
  },
  {
    id:"travel",
    name:"Travel & Transport",
    desc:"Подорожі й транспорт: види транспорту, туризм, інфраструктура.",
    tag:"IELTS"
  },
  {
    id:"family",
    name:"Family & Relationships",
    desc:"Сім'я і стосунки: родинні зв'язки, виховання дітей, міжособистісні стосунки.",
    tag:"IELTS"
  },
  {
    id:"food",
    name:"Food & Diet",
    desc:"Їжа і харчування: продукти, кулінарія, дієти, харчові звички.",
    tag:"IELTS"
  },
  {
    id:"city",
    name:"City & Urban Life",
    desc:"Місто і міське життя: урбанізація, інфраструктура, міські проблеми.",
    tag:"IELTS"
  },
  {
    id:"money",
    name:"Money & Economy",
    desc:"Гроші й економіка: фінанси, торгівля, споживання, економічні системи.",
    tag:"IELTS"
  },
  {
    id:"sport",
    name:"Sport & Leisure",
    desc:"Спорт і дозвілля: види спорту, змагання, активний відпочинок.",
    tag:"IELTS"
  },
  {
    id:"science",
    name:"Science & Innovation",
    desc:"Наука та інновації: наукові відкриття, технологічний прогрес, дослідження.",
    tag:"IELTS"
  }
];

const STORAGE_PREFIX = "basis_progress_";

function loadProgress(topicId){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX + topicId);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}

async function computeTopicStats(topic){
  try{
    const res = await fetch(topic.file);
    const items = await res.json();
    const progress = loadProgress(topic.id);
    const t = Date.now();
    let due = 0, fresh = 0, mastered = 0;
    for(const item of items){
      const p = progress[item.id];
      if(!p) fresh++;
      else if(p.next <= t) due++;
      if(p && p.box >= 5) mastered++;
    }
    return { total: items.length, due, fresh, mastered, ok:true };
  }catch(e){
    return { total:0, due:0, fresh:0, mastered:0, ok:false };
  }
}

async function render(){
  const list = document.getElementById('topicList');
  list.innerHTML = TOPICS.map(t => `<div class="topic-card" data-id="${t.id}" style="opacity:0.5">
    <div class="t-head">
      <span class="t-name">${t.name}</span>
      <span class="t-count">…</span>
    </div>
    <div class="t-desc">${t.desc}</div>
    ${t.tag ? `<span class="topic-tag">${t.tag}</span>` : ''}
    <div class="t-progress"><div class="t-progress-fill" style="width:0%"></div></div>
  </div>`).join('');

  for(const topic of TOPICS){
    const el = list.querySelector(`[data-id="${topic.id}"]`);
    if(!el) continue;
    el.style.opacity = 1;

    if(!topic.file){
      el.classList.add('locked');
      el.querySelector('.t-count').textContent = 'скоро';
      continue;
    }

    const stats = await computeTopicStats(topic);

    if(!stats.ok){
      el.classList.add('locked');
      el.querySelector('.t-count').textContent = 'немає з\'єднання';
      continue;
    }

    const pct = stats.total ? Math.round((stats.mastered / stats.total) * 100) : 0;
    el.querySelector('.t-count').textContent = `${stats.mastered}/${stats.total} вивчено · ${stats.due} на повторення`;
    el.querySelector('.t-progress-fill').style.width = pct + '%';

    el.addEventListener('click', () => {
      window.location.href = `trainer.html?topic=${topic.id}`;
    });
  }
}

render();
</script>

</body>
