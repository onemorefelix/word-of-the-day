<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c0e16">
<title>Англійська — тренажер</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="bg-fx">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div id="fireflies"></div>
</div>

<div class="card">
  <div class="detail-header">
    <a href="index.html" class="detail-back">← Теми</a>
    <span class="detail-title" id="topicLabel">…</span>
  </div>

  <div class="stats">
    <span>На повторення: <b id="dueCount">0</b></span>
    <span>Нових: <b id="newCount">0</b></span>
    <span>Вивчено: <b id="masteredCount">0</b></span>
  </div>

  <div class="stage" id="stage">
    <div class="stage-scroll" id="stageScroll">
      <div class="empty"><div class="big">Завантаження…</div></div>
    </div>
    <div class="stage-fade" id="stageFade"></div>
  </div>

  <div class="actions" id="actions" style="display:none;">
    <button class="btn-forgot" id="forgotBtn">Забув</button>
    <button class="btn-know" id="knowBtn">Знаю</button>
  </div>

  <div class="reset-row">
    <button class="reset-link" id="resetBtn">Скинути прогрес цієї теми</button>
  </div>
</div>

<nav class="tabbar">
  <a href="index.html" class="tab-item active"><span class="tab-dot"></span>Слова</a>
  <a href="grammar.html" class="tab-item"><span class="tab-dot"></span>Граматика</a>
  <a href="reference.html" class="tab-item"><span class="tab-dot"></span>Довідка</a>
  <a href="settings.html" class="tab-item"><span class="tab-dot"></span>Налаштування</a>
</nav>

<script src="app.js"></script>
<script>
/* ---------- Визначення теми з URL ---------- */
const params = new URLSearchParams(window.location.search);
const TOPIC_ID = params.get('topic') || 'core';

const TOPIC_META = {
  core: { name:"Основні слова", file:"data/core.json" },
  environment: { name:"Environment", file:"data/environment.json" },
  education: { name:"Education", file:"data/education.json" },
  technology: { name:"Technology & Media", file:"data/technology.json" }
};

const meta = TOPIC_META[TOPIC_ID] || TOPIC_META.core;
document.getElementById('topicLabel').textContent = meta.name;

const STORAGE_KEY = "basis_progress_" + TOPIC_ID;
const INTERVALS_DAYS = [1, 3, 7, 14, 30];

let ITEMS = [];
let progress = loadProgress();
let currentId = null;
let updateFade = null;

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}

function now(){ return Date.now(); }
function daysToMs(d){ return d * 24 * 60 * 60 * 1000; }

function buildQueue(){
  const t = now();
  const due = [];
  const fresh = [];
  for(const item of ITEMS){
    const p = progress[item.id];
    if(!p){ fresh.push(item.id); }
    else if(p.next <= t){ due.push({id:item.id, next:p.next}); }
  }
  due.sort((a,b) => a.next - b.next);
  return due.map(d => d.id).concat(fresh);
}

function updateStats(){
  const t = now();
  let due = 0, fresh = 0, mastered = 0;
  for(const item of ITEMS){
    const p = progress[item.id];
    if(!p) fresh++;
    else if(p.next <= t) due++;
    if(p && p.box >= 5) mastered++;
  }
  document.getElementById('dueCount').textContent = due;
  document.getElementById('newCount').textContent = fresh;
  document.getElementById('masteredCount').textContent = mastered;
}

function findItem(id){ return ITEMS.find(i => i.id === id); }

function renderCard(id){
  const item = findItem(id);
  const scroll = document.getElementById('stageScroll');

  let formsHtml = '';
  if(item.forms){
    formsHtml = `<div class="forms">
      <span>Present: <b>${item.forms.base}</b><br><i>${item.forms.phBase}</i></span>
      <span>Past: <b>${item.forms.past}</b><br><i>${item.forms.phPast}</i></span>
      <span>Participle: <b>${item.forms.part}</b><br><i>${item.forms.phPart}</i></span>
    </div>`;
  }

  // Повний формат (core): масив прикладів по часах. Легкий формат (теми): 1-2 речення.
  let exHtml = '';
  if(item.examples){
    exHtml = item.examples.map(([tense, sentence]) =>
      `<div class="ex-item">
        <div class="ex-tense">${tense}</div>
        <div class="ex-sentence">"${sentence}"</div>
      </div>`
    ).join('');
  } else if(item.example){
    exHtml = `<div class="ex-item"><div class="ex-sentence">"${item.example}"</div></div>`;
    if(item.example2){
      exHtml += `<div class="ex-item"><div class="ex-sentence">"${item.example2}"</div></div>`;
    }
  }

  const noteHtml = item.note ? `<div class="note">${item.note}</div>` : '';

  scroll.innerHTML = `
    <div class="head-row">
      <p class="word">${item.en}</p>
      <span class="pos">${item.pos}</span>
    </div>
    <div class="phonetic">${item.ph}</div>
    <div class="translation">${item.uk}</div>
    ${formsHtml}
    <div class="divider">✦</div>
    <div class="label">${item.examples ? 'Приклади в різних часах' : 'Приклад'}</div>
    <div class="ex-list">${exHtml}</div>
    ${noteHtml}
  `;

  scroll.scrollTop = 0;
  if(updateFade) setTimeout(updateFade, 60);

  renderActions(id);
}

function renderActions(id){
  const actions = document.getElementById('actions');
  actions.style.display = 'flex';
  const forgotBtn = document.getElementById('forgotBtn');
  const knowBtn = document.getElementById('knowBtn');
  const newForgot = forgotBtn.cloneNode(true);
  const newKnow = knowBtn.cloneNode(true);
  forgotBtn.replaceWith(newForgot);
  knowBtn.replaceWith(newKnow);
  newForgot.addEventListener('click', () => answer(id, false));
  newKnow.addEventListener('click', () => answer(id, true));
}

function removeActions(){
  document.getElementById('actions').style.display = 'none';
}

function renderEmpty(){
  const scroll = document.getElementById('stageScroll');
  scroll.innerHTML = `
    <div class="empty">
      <div class="big">На сьогодні все 🌿</div>
      <p>Ти пройшов усі слова цієї теми, заплановані на повторення. Повертайся завтра — розклад з'явиться автоматично.</p>
    </div>
  `;
  removeActions();
  if(updateFade) setTimeout(updateFade, 60);
}

function renderError(){
  const scroll = document.getElementById('stageScroll');
  scroll.innerHTML = `
    <div class="empty">
      <div class="big">Немає з'єднання</div>
      <p>Дані цієї теми ще не завантажені на пристрій. Відкрий сторінку хоч раз з інтернетом, щоб вона закешувалась для офлайн-використання.</p>
    </div>
  `;
  removeActions();
}

function answer(id, knew){
  const p = progress[id] || {box: 0, next: 0};
  if(knew){
    p.box = Math.min((p.box || 0) + 1, 5);
  } else {
    p.box = 1;
  }
  const intervalIdx = Math.min(p.box - 1, INTERVALS_DAYS.length - 1);
  p.next = now() + daysToMs(INTERVALS_DAYS[intervalIdx]);
  progress[id] = p;
  saveProgress(progress);
  updateStats();
  nextCard();
}

function nextCard(){
  const queue = buildQueue();
  if(queue.length === 0){
    currentId = null;
    renderEmpty();
    return;
  }
  currentId = queue[0];
  renderCard(currentId);
}

document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('Точно скинути прогрес цієї теми? Це не можна відмінити.')){
    progress = {};
    saveProgress(progress);
    updateStats();
    nextCard();
  }
});

/* ---------- Завантаження даних теми ---------- */
fetch(meta.file)
  .then(res => {
    if(!res.ok) throw new Error('fetch failed');
    return res.json();
  })
  .then(items => {
    ITEMS = items;
    updateStats();
    nextCard();
  })
  .catch(() => {
    renderError();
  });

updateFade = initScrollFade('stageScroll', 'stageFade');
</script>

</body>
</html>
